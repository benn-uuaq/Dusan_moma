[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smr-operator-ui"
version = "0.1.0"
description = "PyQt6 operator console for the SMR nondestructive inspection robot"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7,<7",
    "paho-mqtt>=2.1,<3",
    "psycopg[binary]>=3.2,<4",
    # services/tpac_bridge — TPAC 등 외부 Modbus 장치로 로봇 값을 중계한다.
    "pyModbusTCP>=0.3,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
smr-operator-ui = "smr_operator_ui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smr_operator_ui = ["styles/*.qss", "resources/*.ttf", "resources/*.png", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
# ROS 2 Humble이 소싱된 셸에서는 ROS의 pytest 플러그인이 함께 로드된다.
# 이 플러그인들은 pytest 6 API를 사용해 이 프로젝트가 요구하는 pytest 8 이상과
# 충돌하므로 비활성화한다. ROS가 없는 환경에서는 이 설정이 아무 영향도 없다.
addopts = "-p no:launch_testing -p no:launch_ros"
